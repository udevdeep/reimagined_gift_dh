<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Archive</title>
    <link rel="icon" type="image/png" href="https://fonts.gstatic.com/s/i/short-term/release/googlestandardsymbols/auto_awesome/default/24px.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            text-align: center;
            background: #000;
            color: #fff;
        }
        .error-card {
            padding: 40px;
            max-width: 400px;
        }
        h1 {
            font-family: 'EB Garamond', serif;
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3;
        }
        p {
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
            margin: 20px 0 30px;
            line-height: 1.6;
        }
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body class="index-page">
    <div class="error-card">
        <h1>404</h1>
        <p>This part of the archive hasn't been written yet, or it's been tucked away too deeply to find.</p>
        <a href="/" class="back-btn">← Back to the Archive</a>
    </div>
    <script type="module" src="js/speed-insights.js"></script>
</body>
</html>
