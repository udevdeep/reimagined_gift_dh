<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Our Timeline | The Dh Archive</title>
    <meta name="description" content="A chronological journey through our best moments.">
    <meta property="og:title" content="Our Timeline ⏳">
    <meta property="og:description" content="Reliving the journey, one memory at a time.">
    <meta property="og:image" content="https://dh-archive.vercel.app/bumblebee.png">

    <!-- Favicon Package -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">


    
    <!-- Speed Optimization: Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    
    <!-- Modern Serif & Sans Font Stack -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    </script>
</head>
<body class="memories-page">

    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">Loading the archive…</div>
    </div>

    <!-- Security Lock Overlay -->
    <div id="lock-overlay" style="display: none;">
        <div class="lock-card">
            <h2>Sign in</h2>
            <p>Sign in to view this collection.</p>
            <button class="btn-primary" id="google-login-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20">
                Sign in with Google
            </button>
            <p id="lock-msg" style="margin-top:15px; font-size: 0.9rem; min-height: 1.2em;"></p>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-pill-left">
            <a href="index.html" class="nav-brand">dh</a>
            <div class="nav-links">
                <a href="memories.html" class="active">Our Timeline</a>
                <a href="gallery.html">Evidence</a>
                <a href="jokes.html">Jokes</a>
                <a href="feeling-low.html" class="nav-low">Feeling Low?</a>
            </div>
        </div>
        <div class="nav-actions-right">
            <button id="open-grid" title="View Archive Grid">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button class="theme-toggle-btn" id="theme-toggle">Barbie Mode</button>
            <button id="kebab-menu-btn" class="kebab-btn" title="Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Archive Grid Overlay -->
    <div id="grid-overlay" class="grid-overlay">
        <div class="grid-header">
            <h3>The Era of Us</h3>
            <div class="grid-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="cherished">Cherished</button>
            </div>
            <button id="close-grid">&times;</button>
        </div>
        <div id="archive-grid" class="archive-grid">
            <!-- Thumbnails injected here -->
        </div>
    </div>

    <div class="container">
        
        <div id="memories-container">
            <!-- Reels will be injected here -->
        </div>

        <!-- Discrete Controls -->
        <footer style="position: fixed; bottom: 20px; left: 20px; z-index: 1000;">

        </footer>

    </div>

    <!-- Director's Cut / Comment Panel -->
    <div id="comment-panel" class="comment-panel">
        <div class="comment-panel-backdrop"></div>
        <div class="comment-panel-content">
            <div class="comment-panel-header">
                <h3>Director's Cut</h3>
                <button class="close-panel" id="close-comment-panel">&times;</button>
            </div>
            <div class="comment-panel-body">
                <div id="director-backstory" class="director-backstory"></div>
                
                <div class="comments-section">
                    <h4>Comments</h4>
                    <div id="comments-list" class="comments-list">
                        <!-- Comments will be loaded here -->
                        <p class="no-comments">Be the first to leave a note...</p>
                    </div>
                </div>

                <div class="vibe-check">
                    <h4>Vibe Check</h4>
                    <div class="vibe-emojis">
                        <button class="vibe-btn" data-vibe="✨">✨</button>
                        <button class="vibe-btn" data-vibe="😭">😭</button>
                        <button class="vibe-btn" data-vibe="🍕">🍕</button>
                        <button class="vibe-btn" data-vibe="🥂">🥂</button>
                        <button class="vibe-btn" data-vibe="🎓">🎓</button>
                    </div>
                </div>
            </div>
            <div class="comment-input-area">
                <div id="mentions-suggestions" class="mentions-suggestions"></div>
                <div id="replying-to-info" class="replying-to-info" style="display: none;">
                    Replying to <span id="replying-to-name"></span>
                    <button id="cancel-reply">&times;</button>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="comment-input" placeholder="Add a comment...">
                    <button id="submit-comment" class="send-btn">Post</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <button class="lightbox-nav left">❮</button>
        <button class="lightbox-nav right">❯</button>
        <div class="lightbox-controls">
            <a id="lightbox-download" class="lightbox-btn" href="#" download title="Download">⬇</a>
        </div>
        <img id="lightbox-img" class="lightbox-content" src="" alt="" crossorigin="anonymous">
        <video id="lightbox-video" class="lightbox-content" controls style="display:none;"></video>
    </div>

    <script type="module" src="js/speed-insights.js"></script>
    <script src="js/main.js" type="module"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
