<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Evidence | The Dh Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    
    <!-- Speed Optimization: Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    
    <!-- Modern Serif & Sans Font Stack -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    </script>
</head>
<body class="gallery-page">

    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">Loading the archive…</div>
    </div>

    <!-- Security Lock Overlay -->
    <div id="lock-overlay" style="display: none;">
        <div class="lock-card">
            <h2>Sign in</h2>
            <p>Sign in to view this collection.</p>
            <button class="btn-primary" id="google-login-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 20px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20">
                Sign in with Google
            </button>
            <p id="lock-msg" style="margin-top:15px; font-size: 0.9rem; min-height: 1.2em;"></p>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">dh</a>
        <div class="nav-links">
            <a href="memories.html">Our Timeline</a>
            <a href="gallery.html" class="active">Evidence</a>
            <a href="jokes.html">Jokes</a>
            <a href="feeling-low.html" class="nav-low">Feeling Low?</a>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="theme-toggle-btn" id="theme-toggle">Barbie Mode</button>
            <button id="kebab-menu-btn" class="kebab-btn" title="Menu">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 16.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zM12 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM12 9c.83 0 1.5-.67 1.5-1.5S12.83 6 12 6s-1.5.67-1.5 1.5S11.17 9 12 9z"></path></svg>
            </button>
        </div>
    </nav>

    <div class="container">
        <header class="header-section">
            <h1>Evidence</h1>
            <p>Where we were most ourselves.</p>
        </header>

        <!-- Controls -->
        <div class="gallery-toolbar">
            <!-- Media Count (Injected) -->
            <div id="gallery-count" style="font-size: 0.9rem; color: var(--text-muted); font-family: var(--font-body); font-weight: 500; margin-right: auto;"></div>

            <select id="gallery-sort" class="btn-primary" style="appearance: none; text-align: center; min-width: 140px; margin: 0;">
                <option value="default">All Photos</option>
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
            </select>
            
            <div class="zoom-control" style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.8rem; opacity: 0.7;">−</span>
                <input type="range" id="gallery-zoom" min="80" max="350" value="200" step="10" style="width: 100px; accent-color: var(--accent-primary); cursor: pointer;">
                <span style="font-size: 1rem; opacity: 0.7;">+</span>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="gallery-grid">
            <!-- Photos injected here -->
        </div>

        <!-- Map Section -->
        <div class="map-wrapper">
            <h3 class="map-header">
                <span>📍</span> Places
            </h3>
            <p class="map-sub">Where the memories were made.</p>
            <div id="map-container">
                <div id="gallery-map" style="width: 100%; height: 100%; z-index: 1;"></div>
            </div>
        </div>

        <!-- Footer / Discrete Controls -->
        <footer style="margin-top: 20px; text-align: center; padding-bottom: 20px;">

        </footer>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <button class="lightbox-nav left">❮</button>
        <button class="lightbox-nav right">❯</button>
        <div class="lightbox-controls">
            <a id="lightbox-download" class="lightbox-btn" href="#" download title="Download">⬇</a>
        </div>
        <img id="lightbox-img" class="lightbox-content" src="" alt="" crossorigin="anonymous">
        <video id="lightbox-video" class="lightbox-content" controls style="display:none;"></video>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="js/main.js" type="module"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
