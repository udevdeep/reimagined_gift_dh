<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence | The Dh Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">dh</a>
        <div class="nav-links">
            <a href="memories.html">Our Timeline</a>
            <a href="gallery.html" class="active">Evidence</a>
            <a href="jokes.html">Jokes</a>
            <a href="feeling-low.html" class="nav-low">Feeling Low?</a>
        </div>
        <button class="theme-toggle-btn" id="theme-toggle">Barbie Mode</button>
    </nav>

    <div class="container">
        <header class="header-section">
            <h1>Evidence</h1>
            <p>Where we were most ourselves.</p>
        </header>

        <!-- Controls -->
        <div class="gallery-toolbar">
            <select id="gallery-sort" class="btn-primary" style="appearance: none; text-align: center; min-width: 140px;">
                <option value="default">All Photos</option>
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
            </select>
            
            <div class="zoom-control" style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.8rem; opacity: 0.7;">−</span>
                <input type="range" id="gallery-zoom" min="80" max="350" value="200" step="10" style="width: 100px; accent-color: var(--accent-primary); cursor: pointer;">
                <span style="font-size: 1rem; opacity: 0.7;">+</span>
            </div>
        </div>

        <!-- Media Count -->
        <div id="gallery-count" style="text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted); font-family: var(--font-body); font-weight: 500;"></div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="gallery-grid">
            <!-- Photos injected here -->
        </div>

        <!-- Map Section -->
        <div class="map-wrapper">
            <h3 class="map-header">
                <span>📍</span> Places
            </h3>
            <p class="map-sub">Where the memories were made.</p>
            <div id="map-container">
                <div id="gallery-map" style="width: 100%; height: 100%; z-index: 1;"></div>
            </div>
        </div>

        <!-- Footer / Discrete Controls -->
        <footer style="margin-top: 20px; text-align: center; padding-bottom: 20px;">
             <button id="private-toggle" style="background: transparent; border: none; font-size: 0.9rem; color: var(--text-muted); opacity: 0; pointer-events: none; transition: opacity 0.5s ease; cursor: pointer;">Private Access</button>
        </footer>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <button class="lightbox-nav left">❮</button>
        <button class="lightbox-nav right">❯</button>
        <div class="lightbox-controls">
            <button id="lightbox-play" class="lightbox-btn" title="Start Slideshow">▶</button>
            <a id="lightbox-download" class="lightbox-btn" href="#" download title="Download">⬇</a>
        </div>
        <img id="lightbox-img" class="lightbox-content" src="" alt="">
        <video id="lightbox-video" class="lightbox-content" controls style="display:none;"></video>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="js/main.js"></script>
</body>
</html>
